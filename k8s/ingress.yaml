apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deploy-pulse
  namespace: deploy-pulse
spec:
  ingressClassName: nginx
  rules:
    - host: deploy-pulse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deploy-pulse
                port:
                  number: 80
