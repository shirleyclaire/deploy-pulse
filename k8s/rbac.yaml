apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-pulse
  namespace: deploy-pulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-pulse-reader
  namespace: deploy-pulse
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-pulse-reader
  namespace: deploy-pulse
subjects:
  - kind: ServiceAccount
    name: deploy-pulse
    namespace: deploy-pulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-pulse-reader
